[project]
name = "neurostate"
version = "0.1.0"
description = "Real-time attention and relaxation levels from any LSL EEG stream."
readme = "README.md"
authors = [
    { name = "Michal", email = "michalszandarowski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.14.0",
    "pylsl>=1.18.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "typer>=0.27.3",
]

[project.scripts]
neurostate = "neurostate.cli:app"

[project.optional-dependencies]
gui = [
    "pyqtgraph>=0.14.0",
    "pyside6-essentials>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "RUF"]
allowed-confusables = ["µ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
